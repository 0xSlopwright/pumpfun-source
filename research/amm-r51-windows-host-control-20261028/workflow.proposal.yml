# REVIEW COPY ONLY. Not installed under .github/workflows and never dispatched.
# After review, stage this packet as research/amm-r51-windows-host-control-20261028.
name: Measure checked-r51 AMM default Windows v1.44 build

on:
  workflow_dispatch:
    inputs:
      native_inputs_sha256:
        description: 'Reviewed native byte-tree manifest; empty runs preflight only'
        required: false
        default: '24e416c49991394bda6374439d05d8f004144a6e5c93492fc5541a78c472a36e'
        type: string

permissions:
  contents: read

concurrency:
  group: amm-r51-windows-v144-control
  cancel-in-progress: false

jobs:
  measure:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Preserve checkout source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/rebuild-canonical-mayhem-pinned-msvc.yml
            /.github/workflows/measure-amm-r51-windows-v144.yml
            /research/amm-r51-windows-host-control-20261028/
            /research/mayhem-pinned-windows-toolchain-20261028/
            /research/all-contract-completion-20261028/prepare_mayhem_windows_inputs.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Authenticate published source and recipe
        shell: pwsh
        run: python -I -B research/amm-r51-windows-host-control-20261028/verify.py
      - name: Install the previously pinned isolated MSVC cohort
        shell: pwsh
        run: |
          python -I -B research/mayhem-pinned-windows-toolchain-20261028/verify.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B research/mayhem-pinned-windows-toolchain-20261028/install.py --output work/amm-r51-msvc-install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record native preflight or prepare authenticated source build inputs
        shell: pwsh
        env:
          AMM_NATIVE_INPUTS_SHA256: ${{ inputs.native_inputs_sha256 }}
        run: |
          python -I -B research/amm-r51-windows-host-control-20261028/prepare.py --repo "$env:GITHUB_WORKSPACE" --output work/amm-r51-windows/inputs --native-inputs-sha256="$env:AMM_NATIVE_INPUTS_SHA256"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build ordinary Windows default layout with a fresh target
        if: inputs.native_inputs_sha256 != ''
        shell: pwsh
        run: |
          $packet = 'research/amm-r51-windows-host-control-20261028'
          $inputs = 'work/amm-r51-windows/inputs'
          $native = Get-Content "$inputs/native-inputs.json" -Raw | ConvertFrom-Json
          python -I -B "$packet/build.py" --sdk "$inputs/sdk" --vendor "$inputs/vendor" --linux-sysroot "$inputs/linux-sysroot" --msvc "$($native.msvc)" --windows-sdk "$($native.windows_sdk)" --kit-version "$($native.kit_version)" --output work/amm-r51-windows/default
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Recheck complete native trees after compilation
        if: inputs.native_inputs_sha256 != ''
        shell: pwsh
        env:
          AMM_NATIVE_INPUTS_SHA256: ${{ inputs.native_inputs_sha256 }}
        run: |
          python -I -B research/amm-r51-windows-host-control-20261028/prepare.py --repo "$env:GITHUB_WORKSPACE" --output work/amm-r51-windows/native-postcheck --native-inputs-sha256="$env:AMM_NATIVE_INPUTS_SHA256" --check-native-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain actual compiler, linker, and preflight evidence
        if: always()
        shell: pwsh
        run: python -I -B research/amm-r51-windows-host-control-20261028/retain.py --root work/amm-r51-windows
      - name: Retain measurements without caches
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: amm-r51-windows-v144-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/amm-r51-windows/evidence
            work/amm-r51-msvc-install/evidence
          if-no-files-found: warn
          retention-days: 30
