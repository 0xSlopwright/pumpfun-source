name: Qualify CURRENT673 Pump on pinned native macOS v1.44
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pump-current673-native-macos-v144
  cancel-in-progress: false
jobs:
  control:
    if: github.repository == 'shawkkkkk/pumpfun-source'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/qualify-pump-macos-v144.yml
            /scripts/pump_current673_macos_control.py
            /programs/pump/
            /evidence/original/pump/
            /research/pump-current673-macos-qualification/
            /research/pump-final-composition-cold-20261028/build.py
            /research/pump-final-composition-cold-20261028/build-inputs.json
            /research/pump-final-composition-cold-20261028/tools/
      - name: Authenticate exact current source and portable builder
        run: python3 -B scripts/pump_current673_macos_control.py --inspect
      - name: Reproduce both complete CURRENT673 outputs from an empty target
        run: python3 -B scripts/pump_current673_macos_control.py
      - name: Retain actual compiler inputs, outputs and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pump-current673-native-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/pump-current673-macos-control/evidence
          if-no-files-found: error
          retention-days: 30
