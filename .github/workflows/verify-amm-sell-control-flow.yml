name: Verify maintained AMM Sell control flow
on:
  pull_request:
    paths:
      - 'research/amm-sell-control-flow-boundary/**'
      - '.github/workflows/verify-amm-sell-control-flow.yml'
      - 'evidence/original/pump_amm/deployed.so'
      - 'repro/pump_amm/canonical-frontier-20261028/results/build-a/candidate.so'
      - 'repro/pump_amm/canonical-frontier-20261028/results/build-a/canonical-source.tar.gz'
      - 'repro/pump_amm/canonical-frontier-20261028/results/build-a/symbols.so'
      - 'research/amm-sell-returned-key-20261028/builds/clean/unstripped.so.gz'
      - 'research/amm-sell-returned-key-20261028/tools/cfg_attribution.py'
      - 'research/amm-sell-returned-key-20261028/tools/elf_reader.py'
      - 'research/amm-sell-returned-key-20261028/tools/measure.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/amm-sell-control-flow-boundary/
            /evidence/original/pump_amm/deployed.so
            /repro/pump_amm/canonical-frontier-20261028/results/build-a/candidate.so
            /repro/pump_amm/canonical-frontier-20261028/results/build-a/canonical-source.tar.gz
            /repro/pump_amm/canonical-frontier-20261028/results/build-a/symbols.so
            /research/amm-sell-returned-key-20261028/builds/clean/unstripped.so.gz
            /research/amm-sell-returned-key-20261028/tools/cfg_attribution.py
            /research/amm-sell-returned-key-20261028/tools/elf_reader.py
            /research/amm-sell-returned-key-20261028/tools/measure.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B research/amm-sell-control-flow-boundary/verify.py
      - run: python -B research/amm-sell-control-flow-boundary/test_audit.py
