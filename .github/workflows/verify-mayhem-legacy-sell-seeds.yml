name: Verify Mayhem Legacy Sell seeds
on:
  pull_request:
    paths:
      - 'research/mayhem-legacy-sell-seed-lifetime/**'
      - '.github/workflows/verify-mayhem-legacy-sell-seeds.yml'
  push:
    paths:
      - 'research/mayhem-legacy-sell-seed-lifetime/**'
      - '.github/workflows/verify-mayhem-legacy-sell-seeds.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -B research/mayhem-legacy-sell-seed-lifetime/verify.py
      - run: python -B research/mayhem-legacy-sell-seed-lifetime/test_scope.py
