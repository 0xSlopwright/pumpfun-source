name: Verify AMM pool preparation boundaries
on: [push, pull_request, workflow_dispatch]
concurrency:
  # On main each revision gets its own group, so a newer push can neither
  # cancel a running main verification nor displace a pending one; GitHub
  # keeps only one pending run per group regardless of cancel-in-progress.
  # Other refs share one group per ref and cancel superseded runs.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    name: amm-preparation-boundaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Authenticate saved signed boundary replays
        run: python -B research/amm-pool-preparation-boundaries/verify.py
      - name: Reject tampered boundary evidence
        run: python -B research/amm-pool-preparation-boundaries/test_verify.py
