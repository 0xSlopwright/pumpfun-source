name: Verify Pump V3 accumulator key-copy recovery
on:
  pull_request:
    paths:
      - 'research/pump-v3-key-copy-20261029/**'
      - '.github/workflows/verify-pump-v3-key-copy.yml'
  push:
    paths:
      - 'research/pump-v3-key-copy-20261029/**'
      - '.github/workflows/verify-pump-v3-key-copy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: pump-v3-key-copy-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/pump-v3-key-copy-20261029
            /evidence/original/pump
            /evidence/original/pump_fees
            /evidence/dependencies/spl_token
            /evidence/dependencies/spl_token_2022
            /evidence/dependencies/associated_token
            /repro/reconstruction-status-2026-10-26
            /research/imported-lab/analysis/pump_fun/curve-fresh-trades-v3-signed-surfpool.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install solders==0.27.1
      - name: Recompute source, whole-census and signed-observation evidence
        run: python -B research/pump-v3-key-copy-20261029/verify.py --repo-root .
      - name: Recompute original call and bounded data reference correspondence
        run: python -B research/pump-v3-key-copy-20261029/audit_refs.py --repo-root . --compare-retained
      - name: Reject resealed source, fixture and signed-wire substitutions
        run: python -B research/pump-v3-key-copy-20261029/test_verify.py --repo-root .
