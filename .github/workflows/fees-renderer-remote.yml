name: Fees renderer remote research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renderer:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      FEES_REMOTE_ROOT: /tmp/fees-renderer-remote
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/fees-renderer-remote/
            /research/fees-composed-frontier188/
            /scripts/
            /evidence/original/pump_fees/
            /evidence/original/pump/
            /evidence/original/pump_amm/
            /evidence/dependencies/
            /evidence/upstream/pump_fees.json
            /research/imported-lab/analysis/pump_fun/config-snapshot.json
            /research/imported-lab/analysis/pump_fun/amm-v2-trade-fixture.json
            /repro/experiments/quote-selector-differential.json.gz
            /repro/experiments/fee-selector-differential.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyelftools==0.32 solders==0.27.1
      - name: Reconstruct and compare using the pinned SDK
        run: python -B research/fees-renderer-remote/run.py
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fees-renderer-research
          path: ${{ env.FEES_REMOTE_ROOT }}/evidence/
          if-no-files-found: error
          retention-days: 30
