name: Verify Pump exact-SOL guard recovery
on:
  pull_request:
    paths:
      - 'research/pump-exact-sol-guard-20261029/**'
      - '.github/workflows/verify-pump-exact-sol-guard.yml'
  push:
    paths:
      - 'research/pump-exact-sol-guard-20261029/**'
      - '.github/workflows/verify-pump-exact-sol-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: pump-exact-sol-guard-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/pump-exact-sol-guard-20261029
            evidence/original/pump
            repro/reconstruction-status-2026-10-26
            scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Recompute source, byte comparisons and signed local observations
        run: python -B research/pump-exact-sol-guard-20261029/verify.py --repo-root .